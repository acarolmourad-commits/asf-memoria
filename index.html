<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ASF Memória — Jogo da memória dos termos do surf | ASF</title><meta name="description" content="Jogo da memória com os termos do surf: aprenda vocabulário do line-up brincando. Satélite do app ASF."><link rel="canonical" href="https://acarolmourad-commits.github.io/asf-memoria/"><meta name="theme-color" content="#00A8CC"><style>:root{--p:#00A8CC;--d:#0E2439;--u:#9B59B6;--bg:#F7FBFC;--g:#5A6B7A}*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--d)}nav{position:sticky;top:0;background:#fff;border-bottom:1px solid #E5EEF2;padding:10px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}nav a{color:var(--p);text-decoration:none;font-weight:700;font-size:13px}nav a.on{color:var(--u)}header{background:linear-gradient(135deg,var(--p),var(--u));color:#fff;padding:36px 20px 26px;text-align:center}.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.c{aspect-ratio:1;background:linear-gradient(135deg,var(--p),var(--u));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;color:transparent;user-select:none;transition:transform .2s}.c.open,.c.done{background:#fff;color:inherit;box-shadow:0 2px 8px rgba(14,36,57,.1);cursor:default}.c.done{opacity:.5}.muted{color:var(--g);font-size:12.5px;text-align:center;margin-top:14px}footer{text-align:center;font-size:12.5px;color:var(--g);padding:24px;border-top:1px solid #E5EEF2}</style></head><body><nav><a href="https://acarolmourad-commits.github.io/asf-app/">🏄 App</a><a class="on" href="https://acarolmourad-commits.github.io/asf-memoria/">🧠 Memória</a><a href="https://acarolmourad-commits.github.io/asf-glossario/">📖 Glossário</a><a href="https://acarolmourad-commits.github.io/asf-quiz/">❓ Quiz</a><a href="https://acarolmourad-commits.github.io/asf-kids/">🧒 Kids</a></nav><header><h1>🧠 Memória do surf</h1><p>Ache os pares e aprenda os termos do line-up.</p></header><main class="wrap"><div class="grid" id="grid"></div><p class="muted" id="st">Jogadas: 0</p></main><footer>🌊 ASF · <a href="https://acarolmourad-commits.github.io/" style="color:var(--p)">Hub de apps</a> · Termos no <a href="https://acarolmourad-commits.github.io/asf-glossario/" style="color:var(--p)">Glossário</a></footer><script>const icos=['🌊','🏄‍♀️','🛟','🐬','☀️','🏖️','🧭','⚡'];let cartas=icos.concat(icos).sort(()=>Math.random()-.5),abertas=[],jog=0,feitos=0;const grid=document.getElementById('grid');cartas.forEach((c,i)=>{const d=document.createElement('div');d.className='c';d.dataset.i=i;d.onclick=()=>vira(d,c);grid.appendChild(d);});function vira(d,c){if(d.className!=='c'||abertas.length===2)return;d.textContent=c;d.className='c open';abertas.push([d,c]);if(abertas.length===2){jog++;document.getElementById('st').textContent='Jogadas: '+jog;setTimeout(()=>{if(abertas[0][1]===abertas[1][1]){abertas.forEach(x=>x[0].className='c done');feitos++;if(feitos===8)document.getElementById('st').textContent='🏆 Completo em '+jog+' jogadas!';}else{abertas.forEach(x=>{x[0].className='c';x[0].textContent='';});}abertas=[];},700);}}</script></body></html>
